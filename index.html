
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة مهامي</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f4f8;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 500px;
  margin: 20px auto;
  background: white;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 4px 15px #0001;
}
h1 { text-align: center; color: #1769aa; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin: 6px 0;
  border-radius: 8px;
  font-size: 16px;
}
input { border: 1px solid #ccc; }
button {
  border: none;
  background: #1769aa;
  color: white;
  cursor: pointer;
}
li {
  list-style: none;
  background: #f1f6fa;
  margin: 10px 0;
  padding: 12px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-wrap: anywhere;
}
li span { flex: 1; }
li input { width: auto; }
li button {
  width: auto;
  margin: 0;
  padding: 8px 12px;
  background: #d93636;
}
.done { text-decoration: line-through; color: gray; }
#count { text-align: center; color: #555; }
</style>
</head>
<body>
<div class="container">
  <h1>📋 إدارة مهامي</h1>
  <p>نظّم يومك وأنجز مهامك بسهولة.</p>

  <input id="taskInput" type="text"
    placeholder="اكتب المهمة هنا...">

  <button onclick="addTask()">➕ إضافة مهمة</button>

  <p id="count">عدد المهام: 0</p>
  <ul id="taskList"></ul>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("myTasks") || "[]");

function saveTasks() {
  localStorage.setItem("myTasks", JSON.stringify(tasks));
}

function renderTasks() {
  const list = document.getElementById("taskList");
  list.innerHTML = "";

  tasks.forEach((task, index) => {
    const li = document.createElement("li");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.done;

    checkbox.onchange = () => {
      tasks[index].done = checkbox.checked;
      saveTasks();
      renderTasks();
    };

    const span = document.createElement("span");
    span.textContent = task.text;
    if (task.done) span.className = "done";

    const del = document.createElement("button");
    del.textContent = "حذف";
    del.onclick = () => {
      tasks.splice(index, 1);
      saveTasks();
      renderTasks();
    };

    li.append(checkbox, span, del);
    list.appendChild(li);
  });

  const completed = tasks.filter(t => t.done).length;
  document.getElementById("count").textContent =
    `المهام: ${tasks.length} | المكتملة: ${completed}`;
}

function addTask() {
  const input = document.getElementById("taskInput");
  const text = input.value.trim();

  if (!text) {
    alert("اكتب المهمة أولاً");
    return;
  }

  tasks.push({ text: text, done: false });
  saveTasks();
  renderTasks();
  input.value = "";
  input.focus();
}

document.getElementById("taskInput").addEventListener("keydown", e => {
  if (e.key === "Enter") addTask();
});

renderTasks();
</script>
</body>
</html>
